name: CI

# Runs on every PR and on every push to main. No GPU, no secrets, no case data or audio needed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-analysis.txt
      - run: pip install -r requirements-dev.txt -r requirements-analysis.txt
      # test_runtime_per_audio_minute is timing-based and flaky (cold numba start); skipped until fixed.
      - run: python -m pytest #--deselect tests/test_audio_analysis.py::test_runtime_per_audio_minute

  web:
    name: Web lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
