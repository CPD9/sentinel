<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
<title id="t">One call, five steps</title>
<desc id="d">Animated walkthrough of an invented example call: listen, transcribe, understand, decide, show the evidence. A call tile moves through five stages; the transcript appears, facts are extracted, a risk and confidence bar fill and an alarm badge appears, and finally an audio snippet with the cited passage plays.</desc>
