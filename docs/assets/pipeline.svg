<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 976" width="960" height="976" role="img" aria-labelledby="t d">
  <title id="t">SENTINEL pipeline</title>
  <desc id="d">A phone call goes through voice activity detection, Swiss German speech recognition, fact extraction and keyword matching, an evidence validator, a rule engine and a confidence gate. The decision is alarm, review or no alert, followed by a narrative and audio snippets for the dashboard and the trigger API. Evaluation labels reach only evaluate.py.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .h  { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .s  { font: 400 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
      .pl { font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: 0.8px; fill: #334155; }
      .an { font: 400 10px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #1e293b; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
      .lg { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #334155; }
      .box { stroke-width: 1.2; }
      .flow { stroke: #111827; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .cfg  { stroke: #7c3aed; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ap); }
      .qual { stroke: #ea580c; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ao); }
    </style>
    <marker id="ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><polygon points="0,0 10,4 0,8" fill="#111827"/></marker>
    <marker id="ap" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><polygon points="0,0 10,4 0,8" fill="#7c3aed"/></marker>
    <marker id="ao" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><polygon points="0,0 10,4 0,8" fill="#ea580c"/></marker>
  </defs>

  <rect x="6" y="6" width="948" height="964" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <g transform="translate(0,36)">

    <!-- ============ Row A: input + perceive ============ -->
    <rect x="32" y="28" width="120" height="84" rx="12" fill="#fde4ec" stroke="#f4a9c3"/>
    <text class="pl" x="44" y="44">INPUT</text>
    <rect class="box" x="44" y="56" width="96" height="48" rx="8" fill="#fff" stroke="#f4a9c3"/>
    <text class="h" x="92" y="76" text-anchor="middle">Call audio</text>
    <text class="s" x="92" y="92" text-anchor="middle">wav · call_017</text>

    <rect x="280" y="28" width="352" height="84" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
    <text class="pl" x="292" y="44">PERCEIVE · AI, SELF-HOSTED</text>
    <rect class="box" x="292" y="56" width="100" height="48" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text class="h" x="342" y="76" text-anchor="middle">VAD</text>
    <text class="s" x="342" y="92" text-anchor="middle">finds speech</text>
    <rect class="box" x="502" y="56" width="118" height="48" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text class="h" x="561" y="76" text-anchor="middle" style="font-size:12px">Swiss German ASR</text>
    <text class="s" x="561" y="92" text-anchor="middle">faster-whisper</text>

    <path class="flow" d="M140,80 H290"/>
    <text class="an" x="216" y="74" text-anchor="middle">[mono, 16 kHz, T s]</text>
    <path class="flow" d="M392,80 H500"/>
    <text class="an" x="446" y="74" text-anchor="middle">speech[K]{t0,t1}</text>
    <path class="flow" d="M561,104 V138"/>
    <text class="an" x="553" y="127" text-anchor="end">segments[N]{t0,t1,speaker,text,logprob}</text>

    <!-- ============ Row B: transcript store ============ -->
    <rect class="box" x="36" y="140" width="588" height="44" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text class="h" x="50" y="159">Transcript segments + speaker roles</text>
    <text class="s mono" x="50" y="175" style="font-size:10px">artifacts/transcripts/  ·  cached, reused by every re-run</text>

    <path class="flow" d="M178,184 V218"/>
    <text class="an" x="186" y="205">windows[W]{ids,text}</text>
    <path class="flow" d="M482,184 V218"/>
    <text class="an" x="490" y="205">text[N]</text>

    <!-- ============ Row C: extraction (AI) || keywords (rules) ============ -->
    <rect x="36" y="220" width="288" height="92" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
    <text class="pl" x="48" y="236">AI MODEL · APERTUS v1.5 8B</text>
    <rect class="box" x="48" y="244" width="264" height="56" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text class="h" x="62" y="262">Fact extraction</text>
    <text class="s" x="62" y="277">whole call in windows · strict JSON · temp 0</text>
    <text class="s" x="62" y="291">cached by content hash + model + prompt</text>

    <rect x="336" y="220" width="288" height="92" rx="12" fill="#dcfce7" stroke="#86efac"/>
    <text class="pl" x="348" y="236">DETERMINISTIC · NO AI</text>
    <rect class="box" x="348" y="244" width="264" height="56" rx="8" fill="#fff" stroke="#86efac"/>
    <text class="h" x="362" y="262">Keyword matcher</text>
    <text class="s" x="362" y="277">fuzzy match · Swiss German variants</text>
    <text class="s" x="362" y="291">hits are not fed to the LLM</text>

    <!-- ============ Row D: validator + rules ============ -->
    <rect x="36" y="332" width="588" height="172" rx="12" fill="#dcfce7" stroke="#86efac"/>
    <text class="pl" x="612" y="348" text-anchor="end">RULES · NO AI</text>
    <rect class="box" x="48" y="362" width="264" height="48" rx="8" fill="#fff" stroke="#86efac"/>
    <text class="h" x="62" y="381">Evidence validator</text>
    <text class="s" x="62" y="397">ids exist · quote matches · speaker matches</text>
    <rect class="box" x="48" y="446" width="564" height="48" rx="8" fill="#fff" stroke="#86efac"/>
    <text class="h" x="62" y="465">Rule engine</text>
    <text class="s" x="62" y="481">one rule per criterion: validated facts + keyword hits → risk and reason</text>

    <path class="flow" d="M178,312 V360"/>
    <text class="an" x="186" y="340">facts[F]{act,quote,ids}</text>
    <path class="flow" d="M482,312 V444"/>
    <text class="an" x="474" y="400" text-anchor="end">hits[H]{family,term,score}</text>
    <path class="flow" d="M178,410 V444"/>
    <text class="an" x="186" y="431">valid facts[F′]</text>

    <!-- ============ Row E: uncertainty + decision ============ -->
    <rect x="36" y="524" width="588" height="206" rx="12" fill="#ffedd5" stroke="#fdba74"/>
    <text class="pl" x="48" y="540">UNCERTAINTY &amp; DECISION</text>
    <rect class="box" x="48" y="550" width="564" height="54" rx="8" fill="#fff" stroke="#fdba74"/>
    <text class="h" x="62" y="570">Confidence gate</text>
    <text class="s" x="62" y="587">ASR confidence · threshold proximity · conflicting facts · missing evidence · audio noise</text>
    <path class="flow" d="M330,494 V548"/>
    <text class="an" x="338" y="539">risk[6 criteria]{score,reason}</text>

    <path class="flow" d="M330,604 V638"/>
    <text class="an" x="338" y="626">confidence[5 parts]</text>
    <rect class="box" x="48" y="640" width="564" height="78" rx="8" fill="#fff" stroke="#fdba74"/>
    <text class="h" x="62" y="660">Decision</text>
    <text class="s" x="62" y="676">fixed priority: failed stage · missing evidence · low confidence → review; then rule hit → alarm</text>
    <rect x="62" y="686" width="92" height="22" rx="11" fill="#fecaca" stroke="#ef4444"/>
    <text class="h" x="108" y="701" text-anchor="middle" style="font-size:11px;fill:#991b1b">alarm</text>
    <rect x="166" y="686" width="92" height="22" rx="11" fill="#fde68a" stroke="#f59e0b"/>
    <text class="h" x="212" y="701" text-anchor="middle" style="font-size:11px;fill:#92400e">review</text>
    <rect x="270" y="686" width="92" height="22" rx="11" fill="#e5e7eb" stroke="#9ca3af"/>
    <text class="h" x="316" y="701" text-anchor="middle" style="font-size:11px;fill:#374151">no_alert</text>
    <text class="s" x="378" y="701">unsure never becomes a confident alarm</text>

    <!-- ============ Row F: after the decision ============ -->
    <path class="flow" d="M178,730 V762"/>
    <text class="an" x="186" y="751">locked decision</text>
    <path class="flow" d="M482,730 V762"/>
    <text class="an" x="474" y="751" text-anchor="end">evidence[]{start_s,end_s}</text>

    <rect class="box" x="36" y="764" width="288" height="52" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
    <text class="h" x="50" y="782">Narrative · Apertus</text>
    <text class="s" x="50" y="797">reason and “why not flagged”</text>
    <text class="s" x="50" y="810">written only after the decision is locked</text>
    <rect class="box" x="336" y="764" width="288" height="52" rx="10" fill="#dcfce7" stroke="#86efac"/>
    <text class="h" x="350" y="782">Audio snippets · ffmpeg</text>
    <text class="s" x="350" y="797">each evidence passage ±10 s</text>
    <text class="s" x="350" y="810">checked: inside the file, playable</text>

    <!-- bus: results to outputs and to evaluation -->
    <path class="flow" d="M178,816 V866"/>
    <path class="flow" d="M482,816 V866"/>
    <path class="flow" d="M178,842 H678"/>
    <circle cx="178" cy="842" r="3" fill="#111827"/>
    <circle cx="482" cy="842" r="3" fill="#111827"/>
    <text class="an" x="330" y="836" text-anchor="middle">results.json{decision,findings,narrative}</text>
    <text class="an" x="490" y="836">predictions only</text>

    <rect class="box" x="36" y="868" width="288" height="48" rx="10" fill="#fff" stroke="#94a3b8"/>
    <text class="h" x="50" y="888">Web dashboard</text>
    <text class="s" x="50" y="904">Next.js · evidence player, transcript, reasoning</text>
    <rect class="box" x="336" y="868" width="288" height="48" rx="10" fill="#fff" stroke="#94a3b8" stroke-dasharray="5 3"/>
    <text class="h" x="350" y="888">Outcept trigger API</text>
    <text class="s" x="350" y="904">alarms only · optional, enabled by env</text>

    <!-- ============ Right column: legend ============ -->
    <rect x="668" y="0" width="268" height="228" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text class="pl" x="682" y="20">LEGEND</text>
    <rect x="682" y="30" width="14" height="14" rx="3" fill="#fde4ec" stroke="#f4a9c3"/><text class="lg" x="704" y="41">Input audio</text>
    <rect x="682" y="50" width="14" height="14" rx="3" fill="#dbeafe" stroke="#93c5fd"/><text class="lg" x="704" y="61">AI models (self-hosted)</text>
    <rect x="682" y="70" width="14" height="14" rx="3" fill="#dcfce7" stroke="#86efac"/><text class="lg" x="704" y="81">Deterministic rules</text>
    <rect x="682" y="90" width="14" height="14" rx="3" fill="#ffedd5" stroke="#fdba74"/><text class="lg" x="704" y="101">Decision and uncertainty</text>
    <rect x="682" y="110" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/><text class="lg" x="704" y="121">Storage and config files</text>
    <path class="flow" d="M682,142 H714"/><text class="lg" x="722" y="146">data flow</text>
    <path class="cfg" d="M682,162 H714"/><text class="lg" x="722" y="166">config / thresholds condition</text>
    <path class="qual" d="M682,182 H714"/><text class="lg" x="722" y="186">audio quality conditions</text>
    <path d="M682,202 H714" stroke="#b91c1c" stroke-width="5" stroke-linecap="round"/><text class="lg" x="722" y="206">label wall</text>
    <text class="s mono" x="682" y="221" style="font-size:9.5px">[ ] = shape of data on the arrow</text>

    <!-- ============ Right column: config files (conditioning) ============ -->
    <path class="cfg" d="M668,272 H614"/>
    <rect class="box" x="668" y="248" width="268" height="48" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text class="h mono" x="682" y="268" style="font-size:12px">config/keywords.json</text>
    <text class="s" x="682" y="284">families and Swiss German variants</text>

    <path class="cfg" d="M668,470 H614"/>
    <rect class="box" x="668" y="446" width="268" height="48" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text class="h mono" x="682" y="466" style="font-size:12px">config/rules.yaml</text>
    <text class="s" x="682" y="482">conditions per criterion, no code</text>

    <path class="cfg" d="M668,679 H614"/>
    <rect class="box" x="668" y="655" width="268" height="48" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text class="h mono" x="682" y="675" style="font-size:12px">config/thresholds.json</text>
    <text class="s" x="682" y="691">alarm · review · confidence gate</text>

    <!-- ============ Right column: label wall + evaluation ============ -->
    <line x1="652" y1="736" x2="652" y2="928" stroke="#b91c1c" stroke-width="5" stroke-linecap="round"/>
    <text class="pl" x="0" y="0" transform="translate(641,790) rotate(-90)" text-anchor="middle" style="fill:#b91c1c">LABEL ISOLATION</text>
    <rect x="668" y="740" width="268" height="188" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text class="pl" x="680" y="756">OFFLINE EVALUATION</text>
    <rect class="box" x="680" y="764" width="244" height="42" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text class="h mono" x="692" y="782" style="font-size:12px">evaluation.json</text>
    <text class="s" x="692" y="797">labels and original file names</text>
    <path class="flow" d="M802,806 V818"/>
    <rect class="box" x="680" y="820" width="244" height="44" rx="8" fill="#fff" stroke="#111827"/>
    <text class="h mono" x="692" y="838" style="font-size:12px">pipeline/evaluate.py</text>
    <text class="s" x="692" y="853">the only reader of labels</text>
    <path class="flow" d="M802,864 V880"/>
    <rect class="box" x="680" y="882" width="244" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text class="s" x="692" y="903">metrics + confidence intervals → Quality lab</text>
    <!-- ============ conditioning: audio quality -> confidence gate (drawn last, on top) ============ -->
    <path class="qual" d="M128,56 V-4 H644 V577 H614"/>
    <text class="an" x="140" y="-10" style="fill:#c2410c">audio_quality{snr_db, score}  conditions the confidence gate</text>
  </g>
</svg>
