# One rule per criterion in pipeline/schemas.CRITERIA. Rules are data over validated facts and keyword hits.
# Numbers are judgement placeholders except where a comment says they were tuned (on dev + Testset_30 only, never holdout).
version: rules-v2

defaults:
  fire_at: 0.5            # a rule "fires" when it has a supporting fact and risk >= fire_at
  keyword_boost: 0.05     # added when a family keyword hit sits in a supporting fact's cited segments
  keyword_only_risk: 0.15 # risk from family hits alone (no supporting fact); can never alarm (needs a fact)
  # ASR transcripts only: risk from family hits alone (null = keyword_only_risk). Never an alarm (needs a fact).
  # Measured 11 Oct on all 62 calls: no setting helped (best escalation balanced accuracy 0.51 with or without), so off.
  keyword_only_risk_asr: null
  # Counter-evidence: a valid fact in the rule's scope with one of these acts, at or after the supporting fact
  # (and not sharing its segments), multiplies the fact's risk by (1 - discount). "self" = the fact's own
  # non-empty counter_evidence text.
  counter_discount:
    warn: 0.5
    refuse: 0.7
    hypothetical: 0.6
    quote: 0.6
    self: 0.4

rules:
  - criterion: credential_sharing
    enabled: true
    scope: {info_types: [credentials]}
    facts:
      # A customer reading out a code is a review, not an alarm (8 of 10 false alarms on dev+Testset_30, e.g. "the last
      # four are 4-2-4-2", or after the advisor said "please don't tell me any number"). The advisor disclosing, or a
      # third party receiving it, stays an alarm. Tuned on dev+Testset_30 only: esc F1 0.625 -> 0.625, strict-alarm
      # precision 0.45 -> 0.62, false alarms on gold no_alert 10 -> 2, strict-alarm recall 0.43 -> 0.24.
      - {when: {act: disclose, info_type: credentials}, risk: 0.6}
      - {when: {act: disclose, info_type: credentials, speaker: advisor}, risk: 0.9}
      - {when: {act: disclose, info_type: credentials, recipient_third_party: true}, risk: 0.95}
      - {when: {act: request, info_type: credentials}, risk: 0.8}

  - criterion: insider_trading
    enabled: true
    scope: {info_types: [nonpublic_info]}
    facts:
      - {when: {act: request, info_type: nonpublic_info}, risk: 0.85}
      - {when: {act: disclose, info_type: nonpublic_info}, risk: 0.5}

  - criterion: third_party_disclosure
    enabled: true
    scope: {info_types: [client_data]}
    facts:
      - {when: {act: disclose, info_type: client_data, recipient_third_party: true}, risk: 0.9}
      - {when: {act: disclose, info_type: client_data}, risk: 0.5}
      - {when: {act: request, info_type: client_data, recipient_third_party: true}, risk: 0.5}

  - criterion: documentation_concealment
    enabled: true
    scope: {info_types: null}
    needs_keyword: true      # facts have no "documentation" field: require the family keyword in the cited segments
    facts:
      - {when: {act: request, secrecy_cue: true}, risk: 0.8}
      - {when: {act: request}, risk: 0.5}

  - criterion: control_evasion
    enabled: true
    scope: {info_types: null}
    needs_keyword: true      # facts have no "splitting" field: require the family keyword in the cited segments
    facts:
      - {when: {act: request}, risk: 0.8}

  - criterion: payment_card_data
    enabled: true
    scope: {info_types: null}
    keyword_only_risk: 0.3   # classify-only: a read-out number alone is never an alarm
    max_risk: 0.5
    facts: []

  - criterion: other
    enabled: false
    scope: {info_types: null}
    facts: []
